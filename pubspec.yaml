name: dozara
description: İlaç Hatırlatıcı - Medication Reminder App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  lottie: ^3.3.3
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.1.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.2
  flutter_bloc: ^8.1.6

  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.1.2
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.1

  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  supabase_flutter: ^2.12.4
  flutter_animate: ^4.5.2
  
  # Firebase Cloud Messaging
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.0
  
  # Home Screen Widget
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#7C3AED"
  image: assets/icons/app_icon.png
  color_dark: "#4C1D95"
  image_dark: assets/icons/app_icon.png
  android_12:
    color: "#7C3AED"
    image: assets/icons/app_icon.png
  fullscreen: true
